[project]
name = "lgtv_idle_sync"
version = "0.1.0"
description = "Sync idle state to LGTV (with alga)"
authors = [{ name = "Sander Kolman", email = "Sandarr95@users.noreply.github.com" }]
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "alga >= 2.0.1",
    "wakeonlan >= 2.0.0",
    "pywayland >= 0.4.18",
    "dbus-fast >= 2.28.0",
    "pulsectl_asyncio >= 1.2.2",
    "tenacity >= 9.0.0",
]

[dependency-groups]
dev = [ "pyinstaller >= 6.11.1" ]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
lgtv-idle-sync = "lgtv_idle_sync.__main__:cli"
lgtv-graceful-suspend = "lgtv_idle_sync.graceful_suspend:graceful_suspend"
lgtv-screen-off = "lgtv_idle_sync.graceful_suspend:screen_off"
lgtv-screen-on = "lgtv_idle_sync.graceful_suspend:screen_on"
lgtv-install = "lgtv_idle_sync.install:install"
